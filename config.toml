baseURL = 'https://www.overtoneflute.fi/'
languageCode = 'fi-fi'
title = 'Overtone Flute'
theme = 'ananke'

# Määritetään artikkelien URL-rakenne samaksi kuin WordPressissä
[permalinks]
  posts = '/:slug/'

# Navigaatiovalikko yläpalkkiin
[[menu.main]]
  name = 'Home'
  url = '/'
  weight = 1

[[menu.main]]
  name = 'Articles'
  url = '/posts/'
  weight = 2

# Lisää tähän tarvittaessa muita WordPress-sivujasi:
# [[menu.main]]
#   name = 'About'
#   url = '/about/'
#   weight = 3

[params]
  description = 'Overtone flute music, tutorials and resources'
  # Yläpalkin taustaväri
  background_color_class = 'bg-dark-gray'
  # Voit lisätä yläpalkin taustakuvan suhteellisella polulla (static/images/banner.jpg -> /images/banner.jpg)
  # featured_image = '/images/banner.jpg'
  
  buildFuture = true