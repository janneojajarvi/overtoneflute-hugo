{{ define "main" }}
  <article class="cf ph3 ph5-l pv3 center mw8">
    
    <!-- Dynaaminen sisältö markdown-tiedostoista (content/_index.md tai content/en/_index.md) -->
    <div class="nested-links lh-copy light-gray f4 f3-ns nested-img mid-gray">
      {{ .Content }}
    </div>

    <!-- Viimeisimmät blogipostaukset -->
    <section class="mt5 pt4 bt b--dark-gray">
      <h2 class="f3 white fw4 mb4">
        {{ if eq .Lang "fi" }}Viimeisimmät blogipostaukset{{ else }}Latest blog posts{{ end }}
      </h2>
      <div class="flex flex-column gap3">
        {{ range first 5 (where .Site.RegularPages "Type" "in" (slice "posts" "post")) }}
          <div class="mb3">
            <a href="{{ .RelPermalink }}" class="f4 gold db underline hover-white">{{ .Title }}</a>
            <span class="f6 light-gray" style="color: #a0aec0; display: block; margin-top: 0.2rem;">{{ .Date.Format "2.1.2006" }}</span>
          </div>
        {{ end }}
      </div>
    </section>

  </article>
{{ end }}
