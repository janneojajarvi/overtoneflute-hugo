{{ define "main" }}
  <!-- Etusivun oma sisältö (tekstit, bannerit ja kuvat _index.md tiedostosta) -->


  <!-- Viimeisimmät blogipostaukset alapuolelle -->
  <div class="pa4 pa4-ns mw8 center">
    <h2 class="f3 fw4 text-capitalize mb3" style="border-top: 1px solid #2d3748; padding-top: 2rem;">
      {{ if eq .Lang "fi" }}Viimeisimmät blogipostaukset{{ else }}Latest blog posts{{ end }}
    </h2>
    <div class="flex flex-wrap -ns">
      {{ range first 5 (where .Site.RegularPages "Section" "posts") }}
        <div class="w-100 mb3">
          <a href="{{ .RelPermalink }}" class="link white-90 hover-silver fw7">
            {{ .Title }}
          </a>
          <span class="f6 gray db mt1">{{ .Date.Format "2.1.2006" }}</span>
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}
