<header class="site-header pv3 ph4 bg-near-black white">
  <div class="site-title mb2">
    <a href="{{ "/" | relURL }}" class="link white-90 hover-silver fs-6 fw7">
      {{ .Site.Title }}
    </a>
  </div>

  <!-- Kielivalikko (näkyy varmasti kaikilla sivuilla) -->
  <div style="margin-top: 4px; margin-bottom: 16px; font-size: 0.85rem;">
    {{ range .Site.Home.AllTranslations }}
      <a href="{{ .Permalink }}" style="color: #ed8936; text-decoration: underline; margin-right: 12px;">{{ .Language.LanguageName }}</a>
    {{ end }}
  </div>

  <!-- Päävalikko ja alavalikot -->
  <nav class="w-100">
    <ul class="list pl0 ma0 flex flex-column">
      {{ range .Menus.main }}
        <li class="mb2">
          <a href="{{ .URL | relURL }}" class="link white-90 hover-silver fs-6 fw7">{{ .Name }}</a>
          {{ with .Children }}
            <ul class="list pl3 ma0 mt1 flex flex-column">
              {{ range . }}
                <li class="mb1">
                  <a href="{{ .URL | relURL }}" class="link white-70 hover-silver" style="font-size: 0.9rem;">{{ .Name }}</a>
                </li>
              {{ end }}
            </ul>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </nav>
</header>
