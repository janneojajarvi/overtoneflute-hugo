{{ define "main" }}
  <article class="cf ph3 ph5-l pv3 center mw8">
    <header class="pv3">
      <h1 class="f1 fw3 lh-title white ma0 mb4">{{ .Title }}</h1>
    </header>
    
    <div class="lh-copy f4 white mb4">
      {{ .Content }}
    </div>

    {{ if .Pages }}
      <div class="mt4 pt3 bt b--dark-gray">
        <ul class="list p0 m0 flex flex-column gap2">
          {{ range .Pages }}
            <li class="mb2">
              <a href="{{ .RelPermalink }}" class="f4 gold-link db underline hover-white">{{ .Title }}</a>
            </li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  </article>
{{ end }}
