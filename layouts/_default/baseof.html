<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">
  <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css"/>

  <!-- 1. Google Consent Mode v2 oletusasetukset (evästeet estetty ennen lupaa) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Tarkistetaan, onko kävijä jo aiemmin hyväksynyt evästeet
    const savedConsent = localStorage.getItem('ga_consent');
    const initialStatus = savedConsent === 'granted' ? 'granted' : 'denied';

    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': initialStatus
    });
  </script>

  <!-- 2. Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WLMGX9EHN1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WLMGX9EHN1');
  </script>
</head>
<body class="bg-near-black white sans-serif">

  <!-- Mukautettu yläpalkki -->
  {{ partial "site-header.html" . }}

  <!-- Pääsisältö -->
  <main class="pb5" role="main">
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site-footer.html" . }}

  <!-- 3. Evästeilmoitus (piilotettu oletuksena, näytetään JS:llä jos valintaa ei ole tehty) -->
  <div id="cookie-banner" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background-color: #1a202c; border-top: 1px solid #4a5568; padding: 1rem 1.5rem; z-index: 9999; box-shadow: 0 -4px 6px rgba(0,0,0,0.3);">
    <div style="max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
      <p style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: #e2e8f0; flex: 1 1 300px;">
        Käytämme sivustolla evästeitä kävijäliikenteen tilastointiin (Google Analytics), jotta voimme kehittää sivuston oppimateriaaleja.
      </p>
      <div style="display: flex; gap: 0.75rem;">
        <button id="cookie-reject" style="background: transparent; color: #cbd5e0; border: 1px solid #718096; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">
          Vain välttämättömät
        </button>
        <button id="cookie-accept" style="background: #ed8936; color: #1a202c; font-weight: bold; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">
          Hyväksy
        </button>
      </div>
    </div>
  </div>

  <!-- 4. Evästeilmoituksen toimintalogiikka -->
  <script>
    (function() {
      const banner = document.getElementById('cookie-banner');
      const consent = localStorage.getItem('ga_consent');

      // Näytetään ilmoitus vain, jos valintaa ei ole vielä tallennettu
      if (!consent) {
        banner.style.display = 'block';
      }

      document.getElementById('cookie-accept').addEventListener('click', function() {
        localStorage.setItem('ga_consent', 'granted');
        gtag('consent', 'update', {
          'analytics_storage': 'granted'
        });
        banner.style.display = 'none';
      });

      document.getElementById('cookie-reject').addEventListener('click', function() {
        localStorage.setItem('ga_consent', 'denied');
        gtag('consent', 'update', {
          'analytics_storage': 'denied'
        });
        banner.style.display = 'none';
      });
    })();
  </script>

</body>
</html>
